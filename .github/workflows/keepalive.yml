name: Keep Supabase awake

# 무료 Supabase 프로젝트는 오래 접속이 없으면 일시 중지될 수 있어서, 주기적으로 가볍게 두드려요.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 변수가 없어요. 건너뛰어요."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/patterns?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
